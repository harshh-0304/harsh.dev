<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#38bdf8" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Squircle Container -->
  <rect width="100" height="100" rx="24" fill="url(#bg)"/>
  <rect width="98" height="98" x="1" y="1" rx="23" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Architectural 'H' Glyph -->
  <g fill="#ffffff">
    <!-- Left Vertical Bar -->
    <rect x="23" y="27" width="10" height="46" rx="2.5"/>
    <!-- Right Vertical Bar -->
    <rect x="53" y="27" width="10" height="46" rx="2.5"/>
    <!-- Crossbar -->
    <rect x="31" y="45.5" width="24" height="9" rx="2"/>
  </g>

  <!-- Cyan Tech Dot (harsh.dev) -->
  <circle cx="74" cy="68" r="5" fill="#38bdf8" filter="url(#glow)"/>
</svg>
